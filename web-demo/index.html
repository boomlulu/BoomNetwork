<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BoomNetwork Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }

  #unity-container {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #unity-canvas {
    width: 100%; height: 100%;
    background: #1a1a2e;
    cursor: default;
  }

  /* Loading overlay */
  #loading-overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #1a1a2e; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: opacity 0.5s;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }

  #loading-title {
    font-size: 2rem; font-weight: 700;
    margin-bottom: 1.5rem; color: #fff;
  }
  #loading-subtitle {
    font-size: 0.9rem; color: #888;
    margin-bottom: 2rem;
  }

  #progress-bar-outer {
    width: min(80%, 400px); height: 6px;
    background: #333; border-radius: 3px;
    overflow: hidden;
  }
  #progress-bar-inner {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #4fc3f7, #00e676);
    border-radius: 3px;
    transition: width 0.2s;
  }
  #progress-text {
    margin-top: 0.8rem; font-size: 0.85rem; color: #aaa;
  }

  /* Fullscreen button */
  #fullscreen-btn {
    position: fixed; bottom: 12px; right: 12px; z-index: 5;
    padding: 6px 14px; border: 1px solid #555; border-radius: 4px;
    background: rgba(30,30,50,0.8); color: #ccc;
    font-size: 0.8rem; cursor: pointer;
    backdrop-filter: blur(4px);
  }
  #fullscreen-btn:hover { background: rgba(60,60,90,0.9); color: #fff; }

  /* Error */
  #error-message {
    display: none; position: fixed; inset: 0; z-index: 20;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); color: #ff5252;
    font-family: monospace; font-size: 1rem;
    padding: 2rem; text-align: center;
  }
</style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading-overlay">
    <div id="loading-title">BoomNetwork</div>
    <div id="loading-subtitle">Vampire Survivors Demo</div>
    <div id="progress-bar-outer">
      <div id="progress-bar-inner"></div>
    </div>
    <div id="progress-text">Loading...</div>
  </div>

  <button id="fullscreen-btn" title="Toggle fullscreen">Fullscreen</button>
  <div id="error-message"></div>

  <script>
    // --- Config: update these paths after placing your WebGL build ---
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    // For a real build, Unity generates the actual filenames. Replace the
    // placeholders below with the actual filenames from your Build/ folder:
    //   loaderUrl = buildUrl + "/Build.loader.js";
    // The config below will also need real filenames.

    var config = {
      dataUrl:       buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl:   buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl:        buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName:    "BoomNetwork",
      productName:    "VampireSurvivorsDemo",
      productVersion: "1.0",
    };

    var progressBar = document.getElementById("progress-bar-inner");
    var progressText = document.getElementById("progress-text");
    var overlay = document.getElementById("loading-overlay");
    var canvas = document.getElementById("unity-canvas");
    var errorDiv = document.getElementById("error-message");

    // Responsive canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Fullscreen
    document.getElementById("fullscreen-btn").addEventListener("click", function () {
      var el = document.documentElement;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
      }
    });

    // Load Unity
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBar.style.width = (progress * 100).toFixed(0) + "%";
        progressText.textContent = (progress * 100).toFixed(0) + "%";
      }).then(function (instance) {
        overlay.classList.add("hidden");
        setTimeout(function () { overlay.style.display = "none"; }, 600);
      }).catch(function (message) {
        errorDiv.style.display = "flex";
        errorDiv.textContent = message;
      });
    };
    script.onerror = function () {
      errorDiv.style.display = "flex";
      errorDiv.textContent = "Failed to load Unity loader. Make sure Build/ folder contains the WebGL build files.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
