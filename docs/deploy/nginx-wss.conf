# BoomNetwork WSS (WebSocket over TLS) — nginx reverse proxy
#
# nginx 终止 TLS，转发到后端 WsServer（明文 ws://）。
# 浏览器 HTTPS 页面只允许 wss:// 连接，此配置必须部署。
#
# 用法:
#   1. 替换 your-domain.com 为实际域名
#   2. 用 certbot 或手动获取 SSL 证书，替换路径
#   3. 启动 BoomNetwork 服务器: ./framesync -proto ws -addr :9001
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# 客户端连接:
#   wss://your-domain.com/ws   (端口 443，默认)
#   或在 WebGLWebSocketTransport 设置 ForceWss = true

upstream boomnetwork_ws {
    server 127.0.0.1:9001;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket 反代
    location /ws {
        proxy_pass http://boomnetwork_ws;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递真实 IP（服务器 IPRateLimiter 使用）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # 超时设置 — 帧同步需要长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebGL 静态资源（可选，部署 Web Demo 时使用）
    location / {
        root /var/www/boomnetwork-demo;
        index index.html;
        try_files $uri $uri/ =404;

        # CORS headers（WebGL build 加载资源）
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}
