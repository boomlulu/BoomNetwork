name: CI

on:
  push:
    branches: [dev1.0, main]
  pull_request:
    branches: [dev1.0, main]

jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: svr/go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -count=1 ./...

  csharp-test:
    name: C# Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal
